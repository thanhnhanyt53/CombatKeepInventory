name: Build CombatKeepInventory

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java
        run: |
          java -version
          javac -version
          mvn -version

      - name: Clean Maven cache
        run: |
          rm -rf ~/.m2/repository/io/papermc/paper
          rm -rf ~/.m2/repository/com/velocitypowered

      - name: Validate
        run: |
          mvn -B validate

      - name: Build
        run: |
          mvn -B clean package -U

      - name: Verify JARs
        run: |
          echo "=== Bukkit ==="
          ls -lh cki-bukkit/target/*.jar

          echo "=== Velocity ==="
          ls -lh cki-velocity/target/*.jar

          echo "=== Core ==="
          ls -lh cki-core/target/*.jar

      - name: Verify Java bytecode
        run: |
          echo "=== Bukkit ==="
          javap \
            -verbose \
            -classpath cki-bukkit/target/CombatKeepInventory-Bukkit.jar \
            com.votri.combatkeepinv.bukkit.CombatKeepInventory \
            | grep "major version"

          echo "=== Velocity ==="
          javap \
            -verbose \
            -classpath cki-velocity/target/CombatKeepInventory-Velocity.jar \
            com.votri.combatkeepinv.velocity.CombatKeepInventoryVelocity \
            | grep "major version"

      - name: Upload Bukkit
        uses: actions/upload-artifact@v4
        with:
          name: CombatKeepInventory-Bukkit
          path: |
            cki-bukkit/target/CombatKeepInventory-Bukkit.jar
          if-no-files-found: error

      - name: Upload Velocity
        uses: actions/upload-artifact@v4
        with:
          name: CombatKeepInventory-Velocity
          path: |
            cki-velocity/target/CombatKeepInventory-Velocity.jar
          if-no-files-found: error
            
