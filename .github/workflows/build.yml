name: Build CombatKeepInventory

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java
        run: |
          java -version
          javac -version
          mvn -version

      - name: Clean Maven cache for Paper API
        run: |
          rm -rf ~/.m2/repository/io/papermc/paper/paper-api

      - name: Validate Maven project
        run: |
          mvn -B validate

      - name: Build
        run: |
          mvn -B clean package -U

      - name: Show artifacts
        run: |
          echo "=== BUILD ARTIFACTS ==="
          find . \
            -path '*/target/*.jar' \
            -type f \
            -print \
            | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CombatKeepInventory
          path: |
            cki-bukkit/target/*.jar
            cki-velocity/target/*.jar
          if-no-files-found: error
            
