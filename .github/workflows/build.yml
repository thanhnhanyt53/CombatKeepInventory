name: Build CombatKeepInventory

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify project structure
        run: |
          echo "=== ROOT ==="
          pwd
          ls -la

          echo "=== JAVA SOURCES ==="
          find src/main/java -type f -name "*.java" -print

          echo "=== RESOURCES ==="
          find src/main/resources -type f -maxdepth 2 -print

      - name: Build with Maven
        run: mvn -B clean package

      - name: List build output
        run: |
          echo "=== TARGET ==="
          ls -lah target/

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: CombatKeepInventory-v1.0.0
          path: target/*.jar
          if-no-files-found: error
