name: Build CombatKeepInventory

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build Maven Project
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # Java 21
      # ==========================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # ==========================================================
      # Environment information
      # ==========================================================

      - name: Show Java and Maven version
        run: |
          echo "=== JAVA ==="
          java -version

          echo
          echo "=== MAVEN ==="
          mvn -version


      # ==========================================================
      # Project structure
      # ==========================================================

      - name: Show project structure
        run: |
          echo "=== ROOT ==="
          pwd
          ls -la

          echo
          echo "=== MODULES ==="
          find . -maxdepth 2 -type d | sort


      # ==========================================================
      # Java sources
      # ==========================================================

      - name: Show Java sources
        run: |
          echo "=== JAVA SOURCES ==="

          for module in cki-core cki-bukkit cki-velocity; do
            echo
            echo "[$module]"

            if [ -d "$module/src/main/java" ]; then
              find "$module/src/main/java" \
                -type f \
                -name "*.java" \
                | sort
            else
              echo "No Java source directory"
            fi
          done


      # ==========================================================
      # Maven configuration
      # ==========================================================

      - name: Show Maven POM files
        run: |
          echo "=== POM FILES ==="
          find . \
            -type f \
            -name "pom.xml" \
            -print \
            | sort


      # ==========================================================
      # Remove potentially corrupted Maven artifacts
      # ==========================================================

      - name: Clean Paper API cache
        run: |
          echo "Removing cached Paper API..."

          rm -rf ~/.m2/repository/io/papermc/paper/paper-api

          echo "Paper API cache removed."


      # ==========================================================
      # Validate Maven project
      # ==========================================================

      - name: Validate Maven project
        run: |
          mvn -B validate


      # ==========================================================
      # Clean build
      # ==========================================================

      - name: Build
        run: |
          mvn -B clean package -U


      # ==========================================================
      # Verify generated JARs
      # ==========================================================

      - name: Verify artifacts
        run: |
          echo "=== BUILD ARTIFACTS ==="

          find . \
            -type f \
            -path '*/target/*.jar' \
            -print \
            | sort

          echo
          echo "=== ARTIFACT DETAILS ==="

          for jar in $(find . -type f -path '*/target/*.jar'); do
            echo
            echo "----------------------------------------"
            echo "$jar"
            echo "----------------------------------------"
            ls -lh "$jar"

            echo
            echo "JAR test:"
            jar tf "$jar" > /dev/null

            echo "OK"
          done


      # ==========================================================
      # Upload Bukkit artifact
      # ==========================================================

      - name: Upload Bukkit artifact
        uses: actions/upload-artifact@v4
        with:
          name: CombatKeepInventory-Bukkit
          path: |
            cki-bukkit/target/*.jar
          if-no-files-found: error


      # ==========================================================
      # Upload Velocity artifact
      # ==========================================================

      - name: Upload Velocity artifact
        uses: actions/upload-artifact@v4
        with:
          name: CombatKeepInventory-Velocity
          path: |
            cki-velocity/target/*.jar
          if-no-files-found: error
