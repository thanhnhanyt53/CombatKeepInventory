name: Build CombatKeepInventory

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    name: Build and test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 17 is the minimum (Minecraft 1.18+); 21 covers 1.20.5+ and
        # 26.x servers. The bytecode is built for 17 either way, so
        # this checks the plugin still builds and its tests pass on
        # both runtimes.
        java: ['17', '21']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify Java
        run: |
          java -version
          javac -version
          mvn -version

      - name: Clean Maven cache for Paper API
        run: |
          rm -rf ~/.m2/repository/io/papermc/paper/paper-api

      - name: Validate Maven project
        run: |
          mvn -B validate

      - name: Build and run unit tests
        run: |
          mvn -B clean verify -U

      - name: Show artifacts
        run: |
          echo "=== BUILD ARTIFACTS ==="
          find . \
            -path '*/target/*.jar' \
            -type f \
            -print \
            | sort

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/*.txt
          if-no-files-found: ignore

      - name: Upload artifacts
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: CombatKeepInventory
          path: |
            cki-bukkit/target/*.jar
            cki-velocity/target/*.jar
          if-no-files-found: error
