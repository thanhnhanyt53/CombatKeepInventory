name: Build CombatKeepInventory

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java
        run: |
          echo "=== JAVA ==="
          java -version
          echo ""
          javac -version
          echo ""
          mvn -version

      - name: Clean Paper Maven cache
        run: |
          rm -rf ~/.m2/repository/io/papermc/paper

      - name: Show project structure
        run: |
          echo "=== ROOT ==="
          pwd
          ls -la

          echo ""
          echo "=== MODULES ==="
          find . -maxdepth 2 -type d | sort

      - name: Show Java sources
        run: |
          echo "=== JAVA SOURCES ==="

          for module in cki-core cki-bukkit cki-velocity; do
            echo ""
            echo "[$module]"

            if [ -d "$module/src/main/java" ]; then
              find "$module/src/main/java" \
                -type f \
                -name "*.java" \
                | sort
            else
              echo "No Java source directory"
            fi
          done

      - name: Validate Maven
        run: |
          mvn -B -U validate

      - name: Build
        run: |
          mvn -B -U clean package

      - name: Show artifacts
        run: |
          echo "=== BUILD ARTIFACTS ==="

          find . \
            -type f \
            -path '*/target/*.jar' \
            -print \
            | sort

      - name: Upload Bukkit artifact
        uses: actions/upload-artifact@v4
        with:
          name: CombatKeepInventory-Bukkit
          path: cki-bukkit/target/*.jar
          if-no-files-found: error

      - name: Upload Velocity artifact
        uses: actions/upload-artifact@v4
        with:
          name: CombatKeepInventory-Velocity
          path: cki-velocity/target/*.jar
          if-no-files-found: error
            
