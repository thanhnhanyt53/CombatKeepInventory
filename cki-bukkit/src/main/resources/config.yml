# ============================================================
# CombatKeepInventory
# ============================================================

config-version: 3


# ============================================================
# PLATFORM
# ============================================================

platform:

  # auto | bukkit | spigot | paper | purpur
  mode: auto

  # When true, the configured platform must exactly match
  # the detected platform.
  strict: false


# ============================================================
# COMBAT
# ============================================================

combat:

  # Enables CombatTag processing.
  enabled: true

  # CombatTag duration after the latest valid PvP hit.
  duration-seconds: 10

  # Only Player vs Player damage can create CombatTag.
  #
  # Keep this true for the intended CKI behavior.
  player-vs-player-only: true


# ============================================================
# PVP
# ============================================================

pvp:

  # Master switch for CKI PvP handling.
  enabled: true

  # If false:
  #   PvP damage is allowed but CKI does not create combat.
  #
  # If true:
  #   A valid PvP hit creates/refreshes CombatTag.
  use-combat-state: true

  # Cancel actual PvP damage when CKI PvP is disabled.
  block-pvp-when-disabled: true

  command:

    require-permission: true

    permission: combatkeepinventory.pvp


# ============================================================
# DEATH / INVENTORY POLICY
# ============================================================

death:

  # Player kills player after CombatTag has expired.
  pvp-kill-drops: true

  # Player has an active CombatTag when death occurs.
  #
  # IMPORTANT:
  # Any death cause causes inventory loss while CombatTag
  # is still active.
  combat-tag-drops: true

  # No CombatTag + no PvP attribution.
  #
  # PvE/environmental death keeps the inventory.
  pve-keeps-inventory: true


# ============================================================
# INVENTORY / EXPERIENCE
# ============================================================

inventory:

  # Keep XP/levels when CKI keeps or drops inventory.
  keep-experience: true


# ============================================================
# WORLDGUARD
# ============================================================

worldguard:

  # When true, WorldGuard regions can deny PvP handling.
  enabled: true

  # If WorldGuard is not installed:
  #
  # true  = CKI allows PvP normally
  # false = CKI denies PvP
  fail-open: true

  # If WorldGuard denies PvP:
  #
  # true  = cancel the actual PvP damage
  # false = allow the damage but don't create CKI CombatTag
  block-pvp-when-denied: false


# ============================================================
# WORLDS
# ============================================================

worlds:

  enabled: true

  # Completely disable CKI handling in these worlds.
  disabled-worlds: []


# ============================================================
# LISTENER
# ============================================================

listener-priority: HIGHEST


# ============================================================
# DEBUG
# ============================================================

debug:

  # Enables CombatTag/death diagnostic messages.
  #
  # Recommended while testing:
  # true
  #
  # Recommended for production:
  # false
  combat: false