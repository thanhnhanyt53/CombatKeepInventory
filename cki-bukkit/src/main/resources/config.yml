# ============================================================
# CombatKeepInventory
# ============================================================

config-version: 4

# ============================================================
# Platform
# ============================================================

platform:

  # auto = automatically detect Bukkit/Paper/Purpur/etc.
  mode: auto

  # If true, the selected platform must exactly match
  # the detected platform.
  strict: false


# ============================================================
# Combat
# ============================================================

combat:

  # Enables CombatTag processing.
  enabled: true

  # CombatTag duration in seconds.
  duration-seconds: 10


# ============================================================
# Death / Inventory
# ============================================================

death:

  # NOT currently read by any code -- superseded by the
  # reason-specific inventory.policies block below (player-kill /
  # pve-death policies). Left here only so old configs that still
  # have these lines do not fail to parse; they have no effect.
  # Edit inventory.policies.player-kill / pve-death instead.
  pvp-kill-drops: true
  pve-keeps-inventory: true

  # Experience behavior is configured by the reason-specific policies below.
  # The old death.keep-experience key is still accepted for legacy configs.


# ============================================================
# Inventory
# ============================================================

inventory:

  # Legacy/default inventory component settings.
  keep-main: true
  keep-armor: true
  keep-offhand: true
  keep-hotbar: true
  # Legacy/default component settings. Reason-specific policies below are authoritative.
  keep-levels: true

  # 1.2.5 reason-specific inventory policies.
  # action: KEEP, DROP, PARTIAL or VANILLA
  # priority: larger number wins when multiple rules match the same death.
  # Defaults below (400/300/200/100) reproduce the original,
  # pre-priority precedence: combat-death first, then player-kill,
  # then pve-death, then unknown. Equal priority also keeps that
  # same order (combat first). If you want a PvP kill to drop
  # loot even while the victim has an active CombatTag -- i.e.
  # player-kill should outrank combat-death -- raise player-kill's
  # priority above 400 (e.g. 500) yourself; that is NOT the
  # shipped default.
  policies:

    combat-death:
      priority: 400
      action: DROP
      keep-main: false
      keep-armor: false
      keep-offhand: false
      keep-hotbar: false
      keep-experience: true
      keep-levels: true

    player-kill:
      priority: 300
      action: DROP
      keep-main: false
      keep-armor: false
      keep-offhand: false
      keep-hotbar: false
      keep-experience: true
      keep-levels: true

    pve-death:
      priority: 200
      action: KEEP
      keep-main: true
      keep-armor: true
      keep-offhand: true
      keep-hotbar: true
      keep-experience: true
      keep-levels: true

    unknown:
      priority: 100
      action: VANILLA
      keep-main: true
      keep-armor: true
      keep-offhand: true
      keep-hotbar: true
      keep-experience: true
      keep-levels: true


# ============================================================
# Worlds
# ============================================================

worlds:

  # Enables disabled-world checking.
  enabled: true

  # CombatKeepInventory will completely ignore combat/death
  # processing in these worlds.
  disabled-worlds: []


# ============================================================
# WorldGuard
# ============================================================
# Requires the WorldGuard plugin (soft dependency). A location
# only counts as "PvP allowed" if ALL of these pass, checked in
# this order:
#
#   1. It is not covered by a region in excluded-regions.
#   2. If restrict-to-enabled-regions is true, it IS covered by
#      a region in enabled-regions.
#   3. WorldGuard's own native "pvp" region flag does not resolve
#      to deny there. This is WorldGuard's real mechanism, so
#      "/rg flag <region> pvp deny" works as you would expect,
#      and overlapping/nested regions are resolved by WorldGuard's
#      own priority and parent-inheritance rules -- CKI does not
#      reimplement that.
#
# If any check denies, the hit does NOT start a CombatTag.

worldguard:

  # Master switch for the whole WorldGuard integration.
  enabled: true

  # What to do when WorldGuard is missing/unloaded, or a region
  # lookup throws: true = allow PvP/combat tagging (fail open),
  # false = deny it (fail closed).
  fail-open: true

  # true  = BOTH the attacker and the victim must be standing
  #         somewhere that allows PvP.
  # false = it is enough for EITHER one to be.
  require-both-players-in-region: true

  # Regions where CKI combat tagging is always denied, even if
  # WorldGuard's own pvp flag would allow it there.
  excluded-regions: []

  # Only used when restrict-to-enabled-regions is true.
  enabled-regions: []

  # true = combat tagging ONLY happens inside enabled-regions.
  restrict-to-enabled-regions: false


# ============================================================
# Listener
# ============================================================

# Bukkit event priority.
#
# Possible:
# LOWEST
# LOW
# NORMAL
# HIGH
# HIGHEST
# MONITOR
#
# HIGHEST is recommended because CKI should observe the
# final damage/death state after most other plugins.
listener-priority: HIGHEST


# ============================================================
# Debug
# ============================================================

debug:

  # CombatTag creation / refresh information.
  combat: false

  # Damage processing information.
  damage: false

  # Death evaluation information.
  death: false

  # Proxy bridge information.
  bridge: false

  # WorldGuard region/PVP-flag decisions (why a hit was allowed
  # or denied).
  worldguard: false