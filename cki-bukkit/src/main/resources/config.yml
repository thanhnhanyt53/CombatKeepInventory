# ============================================================
# CombatKeepInventory
# Configuration
# ============================================================

# Configuration schema version.
# Do not change manually unless instructed.
config-version: 2


# ============================================================
# PLATFORM
# ============================================================

platform:

  # auto | paper | purpur | spigot
  #
  # auto:
  #   Automatically accepts the detected Bukkit platform.
  mode: auto

  # When true, the configured platform must match
  # the detected platform.
  strict: false


# ============================================================
# COMBAT
# ============================================================

combat:

  # Duration of the Combat Tag in seconds.
  #
  # Example:
  #   10 = player remains tagged for 10 seconds
  #       after the last valid PvP hit.
  duration-seconds: 10


# ============================================================
# PVP
# ============================================================

pvp:

  # Master switch for CKI PvP handling.
  enabled: true

  command:

    # If true, /cki pvp requires the permission below.
    require-permission: true

    permission: combatkeepinventory.pvp


# ============================================================
# WORLDS
# ============================================================

worlds:

  # Enable the disabled-world list.
  enabled: true

  # Worlds where CombatKeepInventory is disabled.
  #
  # Players in these worlds will not receive CKI combat
  # handling according to the plugin's world checks.
  disabled-worlds:
    - example_world


# ============================================================
# EVENT LISTENER
# ============================================================

# Bukkit event priority used by CombatKeepInventory.
#
# Available:
# LOWEST
# LOW
# NORMAL
# HIGH
# HIGHEST
# MONITOR
#
# HIGHEST is recommended because CKI needs to observe
# the final combat/death state after most other plugins.
listener-priority: HIGHEST
