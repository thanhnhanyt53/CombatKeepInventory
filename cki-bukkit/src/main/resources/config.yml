# ============================================================
# CombatKeepInventory
# ============================================================

config-version: 4

# ============================================================
# Platform
# ============================================================

platform:

  # auto = automatically detect Bukkit/Paper/Purpur/etc.
  mode: auto

  # If true, the selected platform must exactly match
  # the detected platform.
  strict: false


# ============================================================
# Combat
# ============================================================

combat:

  # Enables CombatTag processing.
  enabled: true

  # CombatTag duration in seconds.
  duration-seconds: 10


# ============================================================
# Death / Inventory
# ============================================================

death:

  # When a player dies without an active CombatTag
  # and the final death is caused by another player,
  # their inventory is dropped.
  pvp-kill-drops: true

  # When a player dies without an active CombatTag
  # and the death is caused by mobs/environment,
  # keep their inventory.
  pve-keeps-inventory: true

  # Experience behavior is configured by the reason-specific policies below.
  # The old death.keep-experience key is still accepted for legacy configs.


# ============================================================
# Inventory
# ============================================================

inventory:

  # Legacy/default inventory component settings.
  keep-main: true
  keep-armor: true
  keep-offhand: true
  keep-hotbar: true
  # Legacy/default component settings. Reason-specific policies below are authoritative.
  keep-levels: true

  # 1.2.5 reason-specific inventory policies.
  # action: KEEP, DROP, PARTIAL or VANILLA
  # priority: larger number wins when multiple rules match the same death.
  # Defaults below (400/300/200/100) reproduce the original,
  # pre-priority precedence: combat-death first, then player-kill,
  # then pve-death, then unknown. Equal priority also keeps that
  # same order (combat first). If you want a PvP kill to drop
  # loot even while the victim has an active CombatTag -- i.e.
  # player-kill should outrank combat-death -- raise player-kill's
  # priority above 400 (e.g. 500) yourself; that is NOT the
  # shipped default.
  policies:

    combat-death:
      priority: 400
      action: DROP
      keep-main: false
      keep-armor: false
      keep-offhand: false
      keep-hotbar: false
      keep-experience: true
      keep-levels: true

    player-kill:
      priority: 300
      action: DROP
      keep-main: false
      keep-armor: false
      keep-offhand: false
      keep-hotbar: false
      keep-experience: true
      keep-levels: true

    pve-death:
      priority: 200
      action: KEEP
      keep-main: true
      keep-armor: true
      keep-offhand: true
      keep-hotbar: true
      keep-experience: true
      keep-levels: true

    unknown:
      priority: 100
      action: VANILLA
      keep-main: true
      keep-armor: true
      keep-offhand: true
      keep-hotbar: true
      keep-experience: true
      keep-levels: true


# ============================================================
# Worlds
# ============================================================

worlds:

  # Enables disabled-world checking.
  enabled: true

  # CombatKeepInventory will completely ignore combat/death
  # processing in these worlds.
  disabled-worlds: []


# ============================================================
# Listener
# ============================================================

# Bukkit event priority.
#
# Possible:
# LOWEST
# LOW
# NORMAL
# HIGH
# HIGHEST
# MONITOR
#
# HIGHEST is recommended because CKI should observe the
# final damage/death state after most other plugins.
listener-priority: HIGHEST


# ============================================================
# Debug
# ============================================================

debug:

  # CombatTag creation / refresh information.
  combat: false

  # Damage processing information.
  damage: false

  # Death evaluation information.
  death: false

  # Proxy bridge information.
  bridge: false