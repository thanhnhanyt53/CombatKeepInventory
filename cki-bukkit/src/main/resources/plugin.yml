name: CombatKeepInventory
version: '${project.version}'
main: com.votri.combatkeepinv.bukkit.CombatKeepInventory

# Lowest supported server version. Paper/Spigot refuse to load a
# plugin that declares a HIGHER api-version than the server
# itself; a server at or above this version loads it fine (this
# is a floor, not an exact match). Keep this at the oldest
# version actually supported by VersionAdapter below.
api-version: '1.20'

author: ThanhNhan-thanhnhan0928
description: CombatTag and inventory management system.

softdepend:
  - WorldGuard
  - PvPManager

commands:
  cki:
    description: CombatKeepInventory administration command.
    usage: /cki <reload|info|debug [player]>

permissions:

  combatkeepinventory.admin:
    description: Allows administration of CombatKeepInventory.
    default: op

  combatkeepinventory.bypass:
    description: Bypasses CombatKeepInventory combat/death processing.
    default: false

  combatkeepinventory.debug:
    description: Allows toggling live in-game CombatKeepInventory debug output (/cki debug) and viewing per-player debug snapshots, without needing console/log access.
    default: op
