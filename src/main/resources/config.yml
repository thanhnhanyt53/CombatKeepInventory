# ============================================================
# CombatKeepInventory
# Version: 1.1.0-SNAPSHOT-build2
# Config Version: 2
# ============================================================

config-version: 2

# ============================================================
# EVENT LISTENER PRIORITY
# ============================================================
#
# Bukkit event priority:
#
# LOWEST
# LOW
# NORMAL
# HIGH
# HIGHEST
# MONITOR
#
# HIGHEST is recommended.
#
# NOTE:
# MONITOR is normally intended for observation and should not
# be used for modifying/cancelling events.
#
listener-priority: HIGHEST


# ============================================================
# PLATFORM
# ============================================================

platform:

  # auto / paper / purpur / spigot / bukkit
  mode: auto

  # If true, the plugin disables itself when the selected
  # platform does not match the detected server platform.
  strict: false


# ============================================================
# COMBAT
# ============================================================

combat:

  # Combat tag duration in seconds.
  duration-seconds: 10

  # true:
  #   Only Player vs Player damage starts combat.
  #
  # false:
  #   Non-player damage can also start combat.
  #
  # Examples:
  #   Zombie
  #   Skeleton
  #   Projectile from mobs
  #   Other damaging entities
  player-vs-player-only: true


# ============================================================
# DEATH BEHAVIOR
# ============================================================

death:

  # Direct Player vs Player kill:
  #
  # true  = inventory drops
  # false = inventory is kept
  #
  # This can override the server keepInventory gamerule.
  player-kill-drops: true

  # Death while currently combat tagged:
  #
  # true  = inventory drops
  # false = inventory is kept
  combat-death-drops: false

  # Death outside combat:
  #
  # true  = inventory is kept
  # false = inventory drops
  non-combat-death-keeps-inventory: true

  # Keep experience when inventory is kept.
  keep-experience: true


# ============================================================
# WORLDS
# ============================================================

worlds:

  enabled: true

  # CombatKeepInventory is disabled in these worlds.
  disabled-worlds:
    - exampleworld


# ============================================================
# PVP
# ============================================================

pvp:

  # Global PvP state.
  #
  # Can be changed using:
  #
  # /cki pvp on
  # /cki pvp off
  #
  enabled: true

  # If PvP is disabled:
  #
  # true  = cancel PvP damage
  # false = allow damage but do not create CKI combat tags
  block-pvp-when-disabled: true

  command:

    # true:
    #   Permission is required.
    #
    # false:
    #   Everyone can toggle PvP.
    require-permission: true

    permission: combatkeepinventory.pvp


# ============================================================
# WORLDGUARD
# ============================================================

worldguard:

  # WorldGuard integration is optional.
  enabled: true

  # true:
  #   Continue if WorldGuard is unavailable/fails.
  #
  # false:
  #   Deny WorldGuard-dependent actions.
  fail-open: true

  # Empty list means no region-name restriction.
  enabled-regions: []

  restrict-to-enabled-regions: false

  # Regions ignored by CombatKeepInventory.
  excluded-regions:
    - __global__

  # If true, death handling only works inside an allowed region.
  ignore-death-outside-regions: false

  # Both attacker and victim must be inside an allowed region.
  require-both-players-in-region: true

  # If true:
  #   PvP damage itself can be cancelled when WorldGuard denies it.
  #
  # If false:
  #   Only combat tagging is prevented.
  block-pvp-when-denied: false


# ============================================================
# DEBUG
# ============================================================

debug:

  # Log combat-tag information to console.
  combat: false