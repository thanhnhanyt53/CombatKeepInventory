# ============================================================
# CombatKeepInventory
# Version: 1.1.0-SNAPSHOT Build 1
# ============================================================
#
# WARNING:
# This is a SNAPSHOT build and is still being tested.
#
# Source:
# https://github.com/thanhnhanyt53/CombatKeepInventory
#
# ============================================================


# ============================================================
# PLATFORM
# ============================================================

platform:

  # Available:
  #
  # auto
  # paper
  # purpur
  # spigot
  # bukkit
  #
  # "auto" is recommended.
  mode: auto

  # If true, the plugin disables itself when the selected
  # platform does not match the detected server platform.
  strict: false


# ============================================================
# COMBAT
# ============================================================

combat:

  # Combat tag duration in seconds.
  duration-seconds: 10

  # If true:
  # Only non-player damage will NOT create a combat tag.
  #
  # If false:
  # Non-player EntityDamageByEntityEvent damage can also
  # create a combat tag.
  #
  # Player vs Player combat is always handled normally.
  player-vs-player-only: true


# ============================================================
# DEATH
# ============================================================

death:

  # Direct Player vs Player kills:
  #
  # true  = drop inventory
  # false = keep inventory
  #
  # This explicitly overrides the server keepInventory gamerule.
  player-kill-drops: true

  # Death while the player is combat-tagged but the final
  # damage is not directly caused by another player.
  #
  # true  = drop inventory
  # false = keep inventory
  combat-death-drops: false

  # Death outside combat.
  #
  # true  = keep inventory
  # false = drop inventory
  non-combat-death-keeps-inventory: true

  # Keep the player's experience level when inventory is kept
  # or dropped.
  keep-experience: true


# ============================================================
# WORLDS
# ============================================================

worlds:

  # If false, the disabled-world list is ignored.
  enabled: true

  # CombatKeepInventory is completely ignored in these worlds.
  #
  # Example:
  #
  # disabled-worlds:
  #   - lobby
  #   - minigames
  #
  disabled-worlds: []


# ============================================================
# PVP
# ============================================================

pvp:

  # Global PvP state.
  #
  # Can also be changed using:
  #
  # /cki pvp on
  # /cki pvp off
  #
  enabled: true

  # What happens when PvP is globally disabled.
  #
  # true  = cancel Player vs Player damage
  # false = allow PvP damage but do not create CKI combat tags
  block-pvp-when-disabled: true

  command:

    # If true, /cki pvp requires the configured permission.
    #
    # If false, permission is not required.
    require-permission: true

    # Permission required when require-permission is true.
    permission: combatkeepinventory.pvp


  # ==========================================================
  # COMBAT LOG
  # ==========================================================

  combat-log:

    # Enable combat-log detection.
    enabled: true

    # Check CombatKeepInventory's own combat state.
    check-own-combat: true

    # Check PvPManager's combat state.
    check-pvpmanager: true

    # Minimum remaining CKI combat time required before
    # a logout is considered a combat logout.
    #
    # 0 = any active combat tag is enough.
    minimum-remaining-seconds: 0

    # Console commands executed when a player combat-logs.
    #
    # Available placeholders:
    # %player%
    # %uuid%
    #
    commands:
      - "kill %player%"

    # Broadcast a combat-log message.
    broadcast: true

    # Broadcast message.
    #
    # Available placeholder:
    # %player%
    broadcast-message: "&c%player% combat-logged!"

    # Write a combat-log warning to the server console.
    log: false


# ============================================================
# WORLDGUARD
# ============================================================
worldguard:
  # Enable WorldGuard integration.
  enabled: true

  # true  = allow CKI behavior if WorldGuard
  #         is unavailable or an integration error occurs.
  #
  # false = deny WorldGuard-dependent behavior
  #         when WorldGuard cannot be checked.
  fail-open: true

  # Only used when restrict-to-enabled-regions is true.
  enabled-regions: []

  # false = all non-excluded regions are accepted.
  # true  = only enabled-regions are accepted.
  restrict-to-enabled-regions: false

  # Regions ignored by CKI.
  excluded-regions:
    - __global__

  # true  = both attacker and victim must be
  #          inside an allowed region.
  #
  # false = either player being inside an allowed
  #         region is sufficient.
  require-both-players-in-region: true


pvpmanager:
  # Enable optional PvPManager integration.
  enabled: true

  # Read PvPManager's combat state.
  use-combat-state: true

  # If PvPManager is unavailable or its API cannot
  # be resolved, use CKI's own combat tracker.
  fallback-to-own-combat: true


debug:
  enabled: false
  combat: false
  worldguard: false
  pvpmanager: false
  death: false
