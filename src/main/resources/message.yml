# ------------------------------------------------------------
# Plugin
# ------------------------------------------------------------

plugin:
  reloaded: "&aCombatKeepInventory configuration and messages reloaded."


# ------------------------------------------------------------
# General
# ------------------------------------------------------------

general:
  no-permission: "&cYou don't have permission."
  player-only: "&cThis command can only be used by a player."
  unknown-command: "&cUnknown command."
  invalid-argument: "&cInvalid argument."


# ------------------------------------------------------------
# Command
# ------------------------------------------------------------

command:

  usage:
    - "&8&m-----------------------------"
    - "&cCombatKeepInventory"
    - "&e/cki reload &7- Reload configuration"
    - "&e/cki info &7- Plugin information"
    - "&e/cki pvp <on|off> &7- Toggle PvP"
    - "&8&m-----------------------------"

  reload:
    success: "&aCombatKeepInventory has been reloaded."

  info:
    header: "&8&m-----------------------------"
    title: "&cCombatKeepInventory &f1.1.0"
    platform: "&7Platform: &f%platform%"
    selected-platform: "&7Selected mode: &f%mode%"
    duration: "&7Combat duration: &f%seconds% seconds"
    pvp: "&7PvP: &f%pvp%"
    worldguard: "&7WorldGuard: &f%worldguard%"
    pvpmanager: "&7PvPManager: &f%pvpmanager%"
    footer: "&8&m-----------------------------"

  pvp:
    usage: "&eUsage: /cki pvp <on|off>"
    enabled: "&aPvP has been enabled."
    disabled: "&cPvP has been disabled."


# ------------------------------------------------------------
# Combat
# ------------------------------------------------------------

combat:

  tagged: "&cYou are now in combat!"

  expired: "&aYou are no longer in combat."

  combat-log:
    player: "&c%player% combat-logged!"
    kick: "&cYou logged out while in combat."


# ------------------------------------------------------------
# Status
# ------------------------------------------------------------

status:

  enabled: "&aENABLED"
  disabled: "&cDISABLED"

  installed: "&aENABLED"
  not-installed: "&7NOT INSTALLED"
