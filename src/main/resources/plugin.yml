name: CombatKeepInventory
version: 1.1.0
main: com.votri.combatkeepinv.CombatKeepInventory

api-version: '1.21'

author: VoTri
description: >
  Combat-aware inventory management with combat tagging,
  PvP control, bypass support, WorldGuard integration,
  and optional PvPManager integration.

softdepend:
  - WorldGuard
  - PvPManager

commands:
  cki:
    description: Main CombatKeepInventory command
    usage: /cki <reload|info|pvp>
    aliases:
      - combatkeepinventory
      - combatkeepinv

permissions:

  combatkeepinventory.admin:
    description: Allows administration commands such as reload and info
    default: op

  combatkeepinventory.bypass:
    description: Completely bypasses CombatKeepInventory death and combat handling
    default: op

  combatkeepinventory.pvp:
    description: Allows changing the global PvP state with /cki pvp
    default: op