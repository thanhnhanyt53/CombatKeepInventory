name: CombatKeepInventory
version: 3.0.0
main: com.votri.combatkeepinv.CombatKeepInventory

description: >
  Combat-aware inventory retention plugin for Paper
  with optional WorldGuard and PvPManager integrations.

author: ThanhNhan-thanhnhan0928

api-version: '1.21'

load: POSTWORLD

softdepend:
  - WorldGuard
  - PvPManager

commands:
  cki:
    description: CombatKeepInventory main command
    usage: /cki <reload|info|pvp>
    aliases:
      - combatkeepinventory
      - combatkeepinv

permissions:
  combatkeepinventory.admin:
    description: Allows administration of CombatKeepInventory
    default: op

  combatkeepinventory.bypass:
    description: Bypass CombatKeepInventory
    default: op

  combatkeepinventory.pvp:
    description: Allows enabling or disabling PvP
    default: op
