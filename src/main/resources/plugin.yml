name: CombatKeepInventory
version: 3.0.0
main: com.votri.combatkeepinv.CombatKeepInventory
description: Combat-aware inventory retention for Paper 1.21.x through 26.1.x
author: ThanhNhan-thanhnhan0928
api-version: '1.21'
load: POSTWORLD

softdepend:
  - WorldGuard
  - PvPManager

commands:
  cki:
    description: CombatKeepInventory main command
    usage: /cki <reload|info>
    aliases:
      - combatkeepinventory
      - combatkeepinv

permissions:
  combatkeepinventory.admin:
    description: Allows administration of CombatKeepInventory
    default: op

  combatkeepinventory.bypass:
    description: Bypass CombatKeepInventory death handling
    default: op
